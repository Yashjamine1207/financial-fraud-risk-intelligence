[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-fraud-risk-intelligence"
version = "0.1.0"
description = "Financial Fraud Risk and Investigation Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}

dependencies = [
    "numpy>=2.0,<3.0",
    "pandas>=2.2,<3.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "plotly>=5.20,<7.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "pyarrow>=15.0,<22.0",
    "sqlalchemy>=2.0,<3.0",
    "psycopg2-binary>=2.9,<3.0",
    "pandera>=0.20,<1.0",
    "pydantic>=2.7,<3.0",
    "streamlit>=1.35,<2.0",
    "shap>=0.45,<1.0",
    "mlflow>=2.15,<4.0",
    "networkx>=3.3,<4.0",
    "xgboost>=2.1,<4.0",
    "imbalanced-learn>=0.12,<1.0",
    "tensorflow-cpu>=2.21,<2.22"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<8.0",
    "ruff>=0.6,<1.0",
    "black>=24.0,<27.0",
    "mypy>=1.10,<2.0",
    "pre-commit>=3.7,<5.0",
    "jupyter>=1.0,<2.0",
    "ipykernel>=6.29,<8.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true