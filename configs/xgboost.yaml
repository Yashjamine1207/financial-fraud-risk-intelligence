# =============================================================================
# Phase 4 XGBoost tabular fraud-model configuration
# =============================================================================
# This model uses the same chronological train/validation splits and the same
# feature contract as the Logistic Regression baseline.
# =============================================================================

model:
  name: xgboost
  model_version: xgboost-v1.0.0

  objective: binary:logistic
  eval_metric: aucpr

  # Histogram tree construction is efficient for large CPU training workloads.
  tree_method: hist
  device: cpu

  n_estimators: 500
  early_stopping_rounds: 50
  learning_rate: 0.05
  max_depth: 6
  min_child_weight: 5

  subsample: 0.80
  colsample_bytree: 0.80

  # Regularisation controls model complexity.
  reg_alpha: 0.10
  reg_lambda: 5.0
  gamma: 0.0

  # Calculated only from the chronological training labels at fit time.
  scale_pos_weight: auto

  random_state: 42
  n_jobs: -1